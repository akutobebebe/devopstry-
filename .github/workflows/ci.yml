name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t devops-playground .

      
  publish-image:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/ubuntu-lab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/akutobebebe/devops-playground
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"

